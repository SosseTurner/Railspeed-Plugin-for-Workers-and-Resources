; railspeed - raise the hardcoded rail speed limits. This file is UTF-8, no BOM.
;
; Read by plugins\railspeed.dll, which tesmioloader loads out of its plugins
; folder. Deleting the DLL removes the feature entirely; this file only tunes
; it. Nothing here changes the save format - the game stores track pieces, not
; the speeds they imply, so a save made with this plugin loads fine without it
; and simply goes back to the stock limits.
;
; Do not save this file with PowerShell's -Encoding UTF8. It writes a BOM, the
; section header stops matching, and every setting below silently falls back.

[railspeed]

; 0 unloads the plugin without touching anything.
enabled = 1


; ---------------------------------------------------------------- the setting

; The speed limit, in km/h, for concrete rail and for every bridge and tunnel
; tier. This is the one line most people want to change.
;
; Any value up to 400 works - the plugin allocates its own constant rather than
; reusing one of the game's, so you are not restricted to round numbers.
;
; Higher is not automatically better. See the note at the end of this file.
speed = 330


; ---------------------------------------------------- per-tier overrides

; The game does not have one rail speed limit, it has six, and `speed` above
; drives five of them. Set any key here to give that one tier its own figure;
; a key set here always wins over `speed`. Leave one blank to let `speed`
; handle it.
;
; The stock figure is in the comment. Setting a key to its stock value is the
; same as leaving it alone.

; Concrete rail. The main line limit.                            (stock 150)
speed_concrete =

; Tunnels, and one bridge type that shares the same figure.      (stock 120)
speed_120 =

; Bridge and tunnel tiers. Which structure uses which of these is worth
; confirming in your own save - change one, load, and see what responds.
speed_121 =                                                    ; (stock 121)
speed_135 =                                                    ; (stock 135)
speed_140 =                                                    ; (stock 140)

; Wood rail. Deliberately NOT driven by `speed` - the whole point of the two
; track tiers is that the cheap one is slower, and raising this removes any
; reason to ever build concrete. Set it explicitly if you disagree. (stock 70)
speed_wood =


; ---------------------------------------------------------------- notes
;
; A LOCOMOTIVE STILL OBEYS ITS OWN TOP SPEED. The cap a train actually runs at
; is min(locomotive, track). Raising the track limit to 230 does nothing at all
; until the locomotive's $ENGINE_SPEED clears it too. Wagons were tested and do
; not appear to constrain the train, so only the locomotive needs raising.
;
; BEHAVIOUR AT HIGHER SPEEDS. Trains brake harder coming down from a higher
; speed, which is the expected result rather than a fault - they still slow and
; stop normally, and no junction speed limit was observed in testing. If you
; push the figure far past 230 it is worth watching a busy junction once, but
; nothing here is known to break.
;
; VERSION GUARD. Every patch site is checked against the exact bytes SOVIET64
; 1.1.1.7 ships. If the game updates and any site has moved, that site is
; skipped and tesmioloader.log says which one - it will not write into changed
; code. If every site is skipped the plugin unloads itself. A log full of
; "does not match 1.1.1.7" after a patch is the expected, safe outcome, not a
; crash.
